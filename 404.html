<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e14">
    <title>Page not found</title>
    <!-- GitHub Pages serves this file for any missing path, so every URL here is absolute. -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap"
        rel="stylesheet">

    <!-- Instant theme application to prevent flash -->
    <script>
        (function () {
            let theme = 'auto';
            try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch (e) { }
            if (theme !== 'auto') {
                document.documentElement.setAttribute('data-theme', theme);
            }
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
            const meta = document.createElement('meta');
            meta.name = 'theme-color';
            meta.content = isDark ? '#0c0e14' : '#ffffff';
            document.head.appendChild(meta);
        })();
    </script>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .notfound-text {
            max-width: 26em;
            margin: 18px auto 0;
            color: #666;
        }

        html[data-theme="dark"] .notfound-text {
            color: var(--dark-text-muted);
        }

        @media (prefers-color-scheme: dark) {
            html:not([data-theme="light"]) .notfound-text {
                color: var(--dark-text-muted);
            }
        }
    </style>

    <script defer src="/js/scripts.js"></script>
    <script src="https://kit.fontawesome.com/4dd5c549ad.js" crossorigin="anonymous"></script>
</head>

<body>

    <main class="page-wrapper">
        <div class="profile-section">
            <p class="profile-name">lost?</p>
            <p class="profile-subtitle">404 · Page not found</p>
            <p class="notfound-text">There's nothing at this address. The page may have moved, or the link may
                have a typo.</p>
        </div>

        <div class="button-groups">
            <div class="button-group">
                <a href="/">
                    <div class="group-btn"><i class="fa-solid fa-house"></i> Home</div>
                </a>
                <a href="/teaching/">
                    <div class="group-btn"><i class="fa-solid fa-chalkboard-teacher"></i> Teaching</div>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="copyright"><i class="fa-regular fa-copyright"></i> 2023–<span id="currentYear"></span> Bredli Plaku.
            All Rights Reserved.</p>
    </footer>
</body>

</html>
