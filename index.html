<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bredli Plaku: research, teaching materials and academic tools.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e14">
    <title>Bredli's Website</title>
    <link rel="canonical" href="https://bredliplaku.com/">
    <!-- The card a shared link unfolds into (WhatsApp, LinkedIn, Slack…). -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bredliplaku.com/">
    <meta property="og:title" content="Bredli Plaku">
    <meta property="og:description" content="Research, teaching materials and academic tools.">
    <meta property="og:image" content="https://bredliplaku.com/miscellaneous/profile-share.jpg">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">
    <meta property="og:image:alt" content="Bredli Plaku">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap"
        rel="stylesheet">

    <!-- Instant theme application to prevent flash -->
    <script>
        (function () {
            let theme = 'auto';
            try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch (e) { }
            if (theme !== 'auto') {
                document.documentElement.setAttribute('data-theme', theme);
            }
            // Set meta theme-color immediately
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
            const meta = document.createElement('meta');
            meta.name = 'theme-color';
            meta.content = isDark ? '#0c0e14' : '#ffffff';
            document.head.appendChild(meta);
        })();
    </script>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/styles.css">

    <script defer src="js/scripts.js"></script>
    <script src="https://kit.fontawesome.com/4dd5c549ad.js" crossorigin="anonymous"></script>
</head>

<body>

    <main class="page-wrapper">
        <div class="profile-section">
            <!-- The original is 1955px square; at 130px on screen the browser
                 picks the 2x or 3x copy instead (~12–23 KB rather than 255 KB). -->
            <img src="/miscellaneous/profile-260.webp"
                srcset="/miscellaneous/profile-260.webp 260w, /miscellaneous/profile-390.webp 390w, /miscellaneous/profile.webp 1955w"
                sizes="(max-width: 600px) 100px, 130px" class="profile-photo" alt="Bredli Plaku" width="130"
                height="130" fetchpriority="high">
            <p class="profile-name">welcome</p>
            <h1 class="profile-subtitle">Bredli Plaku</h1>
            <div class="profile-links">
                <a href="https://www.linkedin.com/in/bredliplaku/" aria-label="LinkedIn" title="LinkedIn">
                    <i class="fa-brands fa-square-linkedin"></i>
                </a>
                <a href="https://github.com/bredliplaku" aria-label="GitHub" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <!-- The address is in the tooltip too, for anyone whose
                     browser has no mail app to hand the link to. -->
                <a href="mailto:bplaku@epoka.edu.al" aria-label="Email bplaku@epoka.edu.al"
                    title="bplaku@epoka.edu.al">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>
        </div>

        <div class="button-groups">
            <div class="button-group">
                <a href="https://scholar.google.com/citations?user=5-j-0qAAAAAJ">
                    <div class="group-btn"><i class="fa-solid fa-flask"></i> Research</div>
                </a>
                <a href="/teaching/">
                    <div class="group-btn"><i class="fa-solid fa-chalkboard-teacher"></i> Teaching</div>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-tools">
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Theme: Auto" title="Theme: Auto">
                <i id="theme-toggle-icon" class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
            </button>
        </div>
        <!-- The year is filled in by script; the one written here is only
             what shows if scripts don't run. -->
        <p class="copyright"><i class="fa-regular fa-copyright"></i> 2023–<span id="currentYear">2026</span> Bredli
            Plaku. All Rights Reserved.</p>
    </footer>

    <div id="cat-companion">
        <div id="cat-speech-bubble" role="status" aria-live="polite"></div>
        <img id="cat-image" src="/miscellaneous/catto.webp" alt="A friendly cat companion" width="1560"
            height="1140" decoding="async">
    </div>
</body>

</html>
